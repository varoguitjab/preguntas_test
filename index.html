<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pregunta tipo test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      background-color: #f4f6fa;
      color: #1e293b;
    }

    .quiz-container {
      max-width: 750px;
      margin: 60px auto;
      padding: 35px;
      background-color: #ffffff;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    #question {
      margin: 0 0 30px;
      font-size: 23px;
      line-height: 1.5;
      font-weight: 700;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 25px; /* Espacio antes del botón siguiente */
    }

    .option {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      padding: 17px 20px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      background-color: #ffffff;
      color: #334155;
      text-align: left;
      font-size: 16px;
      line-height: 1.5;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .option:hover {
      background-color: #f0f5ff;
      border-color: #93b4ff;
    }

    .option:focus {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    .option:active {
      background-color: #dbeafe;
      border-color: #2563eb;
    }

    .letter {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background-color: #f1f5f9;
      font-weight: bold;
    }

    .option.incorrect {
    background-color: #fef2f2 !important;
    border-color: #ef4444 !important;
    color: #991b1b !important;
  }
  
  .option.incorrect .letter {
    background-color: #fee2e2 !important;
    color: #991b1b !important;
  }
    
    /* --- ESTILOS PARA EL BOTÓN SIGUIENTE --- */
    #btn-next {
      display: block;
      width: 100%;
      padding: 16px 20px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      text-align: center;
    }

    #btn-next:hover {
      background-color: #1d4ed8;
    }

    #btn-next:active {
      transform: scale(0.99);
    }
    /* ------------------------------------- */

    @media (max-width: 500px) {
      .quiz-container {
        margin: 20px auto;
        padding: 22px;
      }

      #question {
        font-size: 20px;
      }

      .option {
        padding: 13px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="quiz-container">
    <h1 id="question">¿Qué pretende mejorar el plan digital de centro?</h1>

    <div class="options">
      <button id="option-a" class="option" type="button" data-option-value="a">
        <span class="letter">A</span>
        <p>La competencia digital, el uso de tecnologías en enseñanza-aprendizaje y la transformación digital del centro</p>
      </button>

      <button id="option-b" class="option" type="button" data-option-value="b">
        <span class="letter">B</span>
        <p>Solo la velocidad de conexión</p>
      </button>

      <button id="option-c" class="option" type="button" data-option-value="c">
        <span class="letter">C</span>
        <p>Únicamente la gestión administrativa</p>
      </button>

      <button id="option-d" class="option" type="button" data-option-value="d">
        <span class="letter">D</span>
        <p>Solo las competencias de la dirección</p>
      </button>
    </div>

    <!-- Botón con ID listo para interactuar con tu JS -->
    <button id="btn-next" type="button">
      Siguiente
    </button>
  </main>

<script type="module" src="script.js"></script>

</body>
</html>
